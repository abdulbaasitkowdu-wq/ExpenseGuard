name: Backend CI

on:
  push:
    branches: [ main, integration/testing ]
  pull_request:
    branches: [ main, integration/testing ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./backend/ExpenseGuard.sln

      - name: Build
        run: dotnet build ./backend/ExpenseGuard.sln --no-restore

      - name: Run tests
        run: dotnet test ./backend/ExpenseGuard.sln --no-build --verbosity normal
