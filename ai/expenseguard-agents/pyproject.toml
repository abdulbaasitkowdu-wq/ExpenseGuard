[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "expenseguard-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.5,<3",
  "langgraph>=0.2,<1",
  "langgraph-checkpoint-postgres>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "langchain-google-genai>=2,<3",
  "google-genai>=1.0,<2",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0,<2"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
